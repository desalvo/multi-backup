apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-backup
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  tls:
    - hosts: [multi-backup.example.org]
      secretName: multi-backup-tls
  rules:
    - host: multi-backup.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: multi-backup
                port: {number: 8080}
