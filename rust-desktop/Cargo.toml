[package]
name = "multi-backup-desktop"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
publish = false

[dependencies]
multi-backup-core = { path = "../rust" }
eframe = { version = "0.30", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
walkdir = "2"
zeroize = "1"
