[package]
name = "multi-backup-core"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
publish = false

[lib]
name = "multi_backup_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
rpassword = "7.3"
scrypt = "0.11"
zeroize = "1.8"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.10"
libc = "0.2"
walkdir = "2.5"
zstd = "0.13"
xz2 = "0.1"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sysinfo = "0.30"
reed-solomon-erasure = "6.0"
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs", "json"] }
url = "2.5"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

# S3 Object Lock PutObject requires Content-MD5 on many endpoints.
md-5 = "0.10"
