[package]
name = "multi-backup-core"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
publish = false

[lib]
name = "multi_backup_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
rpassword = "7.3"
scrypt = "0.11"
zeroize = "1.8"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.10"
walkdir = "2.5"
