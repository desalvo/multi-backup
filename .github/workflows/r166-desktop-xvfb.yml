name: Multi Backup - r166 native Rust GUI/Xvfb runtime acceptance
on:
  push:
    branches: ["feature/r166-ha-gui-agents-acceptance"]
    paths:
      - "rust-desktop/src/main.rs"
      - ".github/workflows/r166-desktop-xvfb.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mb-r166-gui-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-native-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated native GUI OpenGL/X11 prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libasound2-dev libgl1-mesa-dri xvfb xauth
          bash -n scripts/ci/rust-desktop-native-xvfb-r163.sh
      - name: Build actual egui GUI
        run: cargo build --manifest-path rust-desktop/Cargo.toml
      - name: Open, render and close genuine Rust desktop window
        env:
          RUNNER_ENVIRONMENT: github-hosted
        run: bash scripts/ci/rust-desktop-native-xvfb-r163.sh
      - name: Explicit limitation
        run: echo 'Linux native GUI runtime only; not a signed Mac/Windows installer or end-to-end UI backup/restore.' >> "$GITHUB_STEP_SUMMARY"
