name: Multi Backup r218 - optional bilingual current brochures
on:
  push:
    branches: ["feature/r218-mobile-clients"]
    paths:
      - "scripts/build-brochure-r218.py"
      - ".github/workflows/brochures-r218.yml"
      - "docs/MOBILE_CLIENTS_R218_*.md"
      - "docs/brochures/README.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned PDF authoring dependencies
        run: |
          set -euo pipefail
          # No OS package installs: ubuntu runner mirrors may omit poppler-utils.
          # The generator uses DejaVu when present and portable Helvetica fallback.
          python3 -m pip install 'reportlab>=4.2,<5' 'pypdf>=5,<7'
      - name: Generate both real current PDFs and verify contents
        run: |
          set -euo pipefail
          python3 scripts/build-brochure-r218.py --out generated-brochures
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          for lang in ("IT", "EN"):
              path=Path("generated-brochures")/f"Multi-Backup-Brochure-{lang}.pdf"
              assert path.stat().st_size > 10000, "missing brochure content"
              pdf=PdfReader(str(path))
              content=" ".join(page.extract_text() or "" for page in pdf.pages)
              assert len(pdf.pages)>=3
              for marker in ("Multi Backup", "Android", "iPadOS", "16", "34", "VMware"):
                  if marker=="VMware": continue # explained in platform documentation
                  assert marker in content, marker
              print(lang,len(pdf.pages),path.stat().st_size)
          PY
          printf '%s\n' "$GITHUB_SHA" > generated-brochures/SOURCE_SHA
          (cd generated-brochures && sha256sum *.pdf > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: multi-backup-r218-brochures-it-en
          path: generated-brochures/
          retention-days: 21
          if-no-files-found: error
