name: Multi Backup - OpenAFS dedicated field certification (approved SHA only)
# Separate trusted workflow on default branch: PR #11 need not be merged.
# It NEVER runs on pull_request or pull_request_target. Only the repository
# owner may dispatch the fixed reviewed commit on a single-use isolated VM.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact approved PR #11 SHA (pre-filled; do not change unless the trusted workflow pin changes)"
        required: true
        default: 6594b1fd199b4a92ceac93bcbd255b34ef20a34a
        type: string
      confirmation:
        description: "Enter DISPOSABLE-AFS-APPROVED to affirm isolated sacrificial VM"
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate-dispatch:
    name: Validate immutable reviewed SHA before scheduling the sacrificial VM
    if: github.actor == 'desalvo'
    runs-on: ubuntu-24.04
    env:
      PINNED_SHA: 6594b1fd199b4a92ceac93bcbd255b34ef20a34a
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      LAB_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Reject wrong approval inputs WITHOUT consuming ephemeral runner
        run: |
          set -euo pipefail
          if [ "$LAB_CONFIRMATION" != DISPOSABLE-AFS-APPROVED ]; then
            echo "::error::Wrong disposable-lab confirmation"
            exit 1
          fi
          if [ "$EXPECTED_SHA" != "$PINNED_SHA" ]; then
            echo "::error::Wrong reviewed source SHA. Current pinned source: $PINNED_SHA"
            exit 1
          fi
          echo "PASS: approved reviewed SHA and explicit disposable-lab confirmation"
  authentic-openafs:
    needs: validate-dispatch
    name: Real Kerberos, VLDB, volserver, encrypted Rust FULL+incremental restore
    if: github.actor == 'desalvo'
    runs-on: [self-hosted, linux, x64, openafs-ci]
    timeout-minutes: 120
    env:
      PINNED_SHA: 6594b1fd199b4a92ceac93bcbd255b34ef20a34a
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      LAB_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Enforce reviewed exact source and disposable single-use VM BEFORE checkout
        run: |
          set -euo pipefail
          test "$LAB_CONFIRMATION" = DISPOSABLE-AFS-APPROVED
          test "$EXPECTED_SHA" = "$PINNED_SHA"
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$(id -un)" = mb-afs-runner
          test "$(id -u)" -ne 0
          test "$(uname -m)" = x86_64
          . /etc/os-release
          case "$ID:$VERSION_ID:$(uname -r)" in
            debian:12:6.1.*-amd64)
              echo "Debian 12 stock 6.1 x86_64 kernel accepted"
              ;;
            ubuntu:22.04:5.15.*-generic)
              echo "Ubuntu 22.04 GA 5.15 x86_64 kernel accepted"
              ;;
            *)
              echo "::error::Use Debian 12 (Linux 6.1.x-amd64) or Ubuntu 22.04 GA (Linux 5.15.x-generic), on a disposable VM"
              exit 1
              ;;
          esac
          sudo -n true
          test "$(sudo -n cat /etc/multi-backup-ci/allow-disposable-afs)" = DEDICATED_DISPOSABLE_OPENAFS_CELL_VM
          if sudo -n test -e /var/lib/multi-backup-ci/afs-active; then
            echo "::error::Lab already has an active/stale lease; inspect runner and previous job before admin recovery"
            exit 1
          fi
          sudo -n install -d -m 0700 /var/lib/multi-backup-ci
          printf '%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sudo -n tee /var/lib/multi-backup-ci/afs-active >/dev/null
          sudo -n chmod 0600 /var/lib/multi-backup-ci/afs-active
          test -d "/lib/modules/$(uname -r)/build"
          sudo -n modprobe openafs
          grep -q '^openafs ' /proc/modules
          printf 'OpenAFS VM checked: %s\n' "$(uname -r)"
      - uses: actions/checkout@v4
        with:
          ref: 6594b1fd199b4a92ceac93bcbd255b34ef20a34a
          persist-credentials: false
      - name: Verify immutable checked-out PR source and Rust toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_SHA"
          command -v cargo
          command -v rustc
          command -v age
          command -v kinit
          command -v jq
      - name: Install SHA-pinned real OpenAFS/Kerberos provisioning collection
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mb-afs-ansible"
          "$RUNNER_TEMP/mb-afs-ansible/bin/pip" install 'ansible-core>=2.17,<2.18'
          "$RUNNER_TEMP/mb-afs-ansible/bin/ansible-galaxy" collection install \
            git+https://github.com/openafs-contrib/ansible-openafs.git,11fa2a5bbb27d4b44d297c5105f7dd9bc6347190
      - name: Fix Debian 12 OpenAFS real cacheinfo fact detection in SHA-pinned upstream collection
        run: |
          set -euo pipefail
          . /etc/os-release
          if [ "$ID:$VERSION_ID" = debian:12 ]; then
            python3 scripts/patch-openafs-ansible-debian-facts.py "$HOME/.ansible/collections/ansible_collections/openafs_contrib/openafs/plugins/modules/openafs_get_install_paths.py"
          fi
      - name: Repair cached Debian install-path fact only against real OpenAFS cacheinfo
        run: |
          set -euo pipefail
          . /etc/os-release
          if [ "$ID:$VERSION_ID" = debian:12 ]; then
            sudo -n python3 - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path

          path = Path('/etc/ansible/facts.d/openafs.fact')
          real_cacheinfo = Path('/etc/openafs/cacheinfo')
          if path.is_file() and real_cacheinfo.is_file():
              facts = json.loads(path.read_text(encoding='utf-8'))
              dirs = facts.setdefault('dirs', {})
              if not dirs.get('viceetcdir'):
                  dirs['viceetcdir'] = '/etc/openafs'
                  fd, temp = tempfile.mkstemp(prefix='.openafs-facts.', dir=str(path.parent))
                  try:
                      with os.fdopen(fd, 'w', encoding='utf-8') as out:
                          json.dump(facts, out)
                      os.chmod(temp, 0o644)
                      os.replace(temp, path)
                      print('PASS: repaired real Debian OpenAFS viceetcdir fact after checkpoint 3')
                  finally:
                      if os.path.exists(temp):
                          os.unlink(temp)
              else:
                  print('PASS: real OpenAFS viceetcdir fact already present')
          elif path.is_file() and not real_cacheinfo.is_file():
              print('OpenAFS client cacheinfo missing; leave installed facts unchanged')
          else:
              print('No installed local OpenAFS facts yet; first-run Ansible module workaround will apply')
          PY
          fi
      - name: Permit ONLY the non-root AFS runner group to read authentic Ansible installation facts
        run: |
          set -euo pipefail
          python3 scripts/patch-openafs-ansible-local-facts-access.py \
            "$HOME/.ansible/collections/ansible_collections/openafs_contrib/openafs/playbooks/local_install.yaml"
      - name: Deploy genuine isolated KDC and OpenAFS local test cell
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mb-afs-ansible/bin/ansible-playbook" openafs_contrib.openafs.local_install \
            -i 'localhost,' -c local -e afs_cell=example.com -e afs_realm=EXAMPLE.COM \
            -e afs_install_method=managed -e afs_module_install_method=dkms
          for exe in vos fs tokens kinit aklog; do command -v "$exe"; done
          mount | grep -i afs
          test -d /afs/example.com/test
      - name: Build actual encrypted Rust backup/restore CLI
        run: cargo build --manifest-path rust/Cargo.toml --release --bin multi-backup-native
      - name: Run real OpenAFS full + incremental + new-volume recovery acceptance
        run: bash scripts/test-real-afs-cell.sh
      - name: Record genuine cell, source pin and acceptance result
        run: |
          echo "PASS real Kerberos KDC/AFS token/VLDB/volserver + encrypted FULL/incremental and new-volume byte-identical restore" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable reviewed source SHA: $PINNED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Proxmox lab VM retained; only the ephemeral GitHub runner session is removed after this job." >> "$GITHUB_STEP_SUMMARY"

      - name: Release the isolated lab job lease, including failed runs
        if: always()
        run: |
          set -euo pipefail
          if sudo -n test -e /var/lib/multi-backup-ci/afs-active; then
            HELD=$(sudo -n cat /var/lib/multi-backup-ci/afs-active)
            EXPECTED="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
            if [ "$HELD" != "$EXPECTED" ]; then
              echo "::error::Lease does not belong to this job. Manual inspection required; not deleting it."
              exit 1
            fi
            sudo -n rm -f /var/lib/multi-backup-ci/afs-active
            echo "PASS: lab lease released for reusable isolated Proxmox VM"
          fi
