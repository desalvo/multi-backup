name: Multi Backup r214 - scoped POSIX READY native end-to-end gate
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mb-r214-posix-ready-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-regular-file-ready:
    name: Compiled POSIX content-only native encryption and failure-mode acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install real age executable
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y age
      - name: Verify real Rust plugin contract and POSIX encrypted restore
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml --lib plugins
          cargo test --manifest-path rust/Cargo.toml --lib plugin_executor
          cargo test --manifest-path rust/Cargo.toml --test plugin_dispatch_roundtrip -- --nocapture
      - name: Reconcile catalog with no false provider Ready promotion
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/Cargo.toml --bin multi-backup-native
          rust/target/debug/multi-backup-native plugins list --json > /tmp/mb-catalog.json
          rust/target/debug/multi-backup-native plugins plan --mode backup --input posix --output posix --json > /tmp/mb-ready.json
          python3 - <<'PY'
          import json
          cat=json.load(open('/tmp/mb-catalog.json'))
          assert len(cat)==33, 'Unexpected plugin count'
          ready=[p for p in cat if 'ready' in (p['backup_input'],p['backup_output'],p['restore_input'],p['restore_output'])]
          assert [p['id'] for p in ready]==['posix','postgresql'],ready
          assert 'content_only_quiesced_regular_files' in ready[0]['ready_scope']
          assert 'postgresql16_single_database_full_logical_create_only' in ready[1]['ready_scope']
          assert ready[1]['backup_output']=='unsupported'
          assert ready[1]['restore_input']=='unsupported'
          p=json.load(open('/tmp/mb-ready.json'))
          assert p['executable'] is True
          assert p['preview_executable'] is False
          assert p['confirmation_required_before_writes'] is True
          for item in cat:
              if item['id'] not in ('posix','postgresql'):
                  assert item['ready_scope'] is None
          print('PASS scoped local POSIX content-only READY and PostgreSQL catalog scope; other 31 providers remain Preview/Planned')
          PY
      - name: Scope statement
        if: success()
        run: |
          echo 'PASS only data bytes of quiesced POSIX regular files are READY, with authenticated age and new destination restore.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NOT included: ACL/xattr, uid/gid, modes, timestamps, symlinks, hardlinks, empty dirs or live application consistency.' >> "$GITHUB_STEP_SUMMARY"
