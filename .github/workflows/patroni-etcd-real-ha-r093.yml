name: Multi Backup - real Patroni TLS etcd quorum and PostgreSQL HA acceptance
on:
  push:
    branches: ["feature/r060-baremetal-server-cluster-vault"]
    paths:
      - '.github/ci-requests/patroni-ha-r093.request'
      - '.github/ci-requests/patroni-ha-r096.request'
      - '.github/ci-requests/patroni-ha-r100.request'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multi-backup-patroni-real-${{ github.ref }}
  cancel-in-progress: false
jobs:
  patroni-etcd-real:
    name: Real 3x Patroni PG16 / 3x TLS etcd, primary promotion and DCS fencing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install actual PostgreSQL16 Patroni and etcd services (loopback CI only)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-client-16 patroni python3-psycopg2 \
            python3-etcd etcd-server etcd-client openssl
          command -v patroni
          command -v etcd
          command -v etcdctl
          /usr/lib/postgresql/16/bin/pg_ctl --version
          python3 -m py_compile scripts/ci/patroni-etcd-real-ha.py
      - name: Test real 3-member etcd mTLS and 3 PostgreSQL Patroni nodes
        shell: bash
        run: python3 scripts/ci/patroni-etcd-real-ha.py
