name: Full CI - tests and security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile modules
        run: python -m compileall -q .
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Validate command help
        run: |
          python multi_backup.py --version
          python multi_backup.py --help
          python multi_backup.py backup --help
  security:
    name: Security checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'bandit>=1.7,<2' 'ruff>=0.9,<1' 'pip-audit>=2.7,<3'
      - name: Check parse correctness and undefined names
        run: ruff check --select E4,E7,E9,F63,F7,F82 .
      - name: Analyze risky code paths
        run: bandit -q -r . -x ./tests,./.git -ll
      - name: Audit runtime Python dependencies
        run: |
          python -m pip_audit -r requirements.txt
      - name: Validate packaging metadata
        run: |
          test -s LICENSE
          test -s README.md
          test -s README.IT.md
          test -s docs/SECURITY.md
