name: Multi Backup - Production CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multi-backup-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  production-gate:
    name: Production Gate - tests, security and release policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test Python 3.11
        uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install runtime dependencies for Python 3.11
        run: python -m pip install -r requirements.txt
      - name: Python 3.11 tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Test Python 3.12
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime dependencies for Python 3.12
        run: python -m pip install -r requirements.txt
      - name: Python 3.12 tests and CLI smoke
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
          python multi_backup.py --version
          python multi_backup.py --help
          python multi_backup.py backup --help
          python multi_backup.py plugins
      - name: Test Python 3.13
        uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install runtime dependencies for Python 3.13
        run: python -m pip install -r requirements.txt
      - name: Python 3.13 tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Activate security auditing environment
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install static-analysis and dependency-audit tools
        run: python -m pip install 'bandit>=1.7,<2' 'ruff>=0.9,<1' 'pip-audit>=2.7,<3' 'PyYAML>=6,<7'
      - name: Static correctness gate
        run: |
          # Compact legacy lines (E701/E702) are a documented formatting backlog.
          # Syntax errors, broken imports, undefined names, bare excepts remain blocking.
          ruff check --select E4,E9,F63,F7,F82 --extend-select E722 .
      - name: Security code audit
        run: bandit -q -r . -x ./tests,./.git -ll
      - name: Runtime and documentation dependency vulnerability audit
        run: |
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-docs.txt
      - name: Rust core migration compatibility tests
        run: |
          cargo --version
          cargo test --manifest-path rust/Cargo.toml
          cargo build --manifest-path rust/Cargo.toml --release
          python -m unittest discover -s tests -p test_rust_bridge.py -v
      - name: Packaging, documentation and trust-policy gate
        run: python scripts/check-production-gate.py

  publications-smoke:
    name: Native GUI screenshots and EN/IT PDF publication smoke
    needs: [production-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install headless GUI and PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth python3-tk fonts-dejavu-core poppler-utils
          python -m pip install -r requirements.txt -r requirements-docs.txt
          python scripts/create-photo-assets.py
      - name: Open current GUI and About; render bilingual publications
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1680x1200x24" python scripts/capture-ui.py
          python scripts/build-publications.py
          test -s docs/screenshots/about.png
          for item in docs/manuals/*.pdf docs/brochures/*.pdf; do
            test -s "$item"
            pdftotext "$item" - | grep -qi 'Multi Backup'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-gui-and-about-preview
          path: |
            docs/screenshots/*.png
            docs/manuals/*.pdf
            docs/brochures/*.pdf
          retention-days: 7
  macos-smoke:
    name: macOS unsigned app startup (${{ matrix.arch }}, never distributed)
    needs: [production-gate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install helper tools
        run: brew install age gh git-lfs
      - name: Build and test unsigned native app (never publish)
        env:
          MAC_UNSIGNED_SMOKE: '1'
          MAC_ARCH: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: bash scripts/build-macos-app.sh
      - name: Build and install-check one-app ad-hoc signed TEST DMG
        env:
          MAC_ARCH: ${{ matrix.arch }}
        run: bash scripts/package-macos-test-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-preview
          path: |
            multi-backup-macos-${{ matrix.arch }}.dmg
            checksums-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14

  native-release:
    name: Native packages and publication (after Production Gate and macOS smoke)
    needs: [production-gate, macos-smoke, publications-smoke]
    if: >-
      github.event_name != 'pull_request' &&
      ((github.ref == 'refs/heads/main' &&
        (github.event_name == 'workflow_dispatch' ||
         contains(github.event.head_commit.message, '[full-ci]'))) ||
       (startsWith(github.ref, 'refs/tags/v') &&
        !contains(github.ref_name, '-rc')))
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/build-native.yml
    secrets: inherit
