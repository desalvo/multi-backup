name: Multi Backup - Native packages (reusable; requires Production Gate)
on:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: multi-backup-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    name: Determine distribution channel
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      tag: ${{ steps.channel.outputs.tag }}
    steps:
      - id: channel
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo '::error::Stable tags must be vMAJOR.MINOR.PATCH'; exit 1;
            }
            echo 'channel=stable' >> "$GITHUB_OUTPUT"
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo 'channel=early-release' >> "$GITHUB_OUTPUT"
            echo 'tag=early-release' >> "$GITHUB_OUTPUT"
          fi
  macos:
    name: macOS ${{ matrix.arch }} DMG
    needs: [qualify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Import Developer ID certificate and configure notarization (stable required)
        if: needs.qualify.outputs.channel == 'stable'
        shell: bash
        env:
          MAC_SIGNING_ID: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_SIGN_P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_SIGN_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for variable in MAC_SIGNING_ID APPLE_SIGN_P12_B64 APPLE_SIGN_PASSWORD APPLE_NOTARY_KEY_B64 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing $variable. Configure Apple Developer ID and App Store Connect API secrets; refusing to distribute an untrusted DMG."
              exit 1
            fi
          done
          [[ "$MAC_SIGNING_ID" == 'Developer ID Application:'* ]] || {
            echo '::error::Only Developer ID Application identities are accepted for Gatekeeper distribution'
            exit 1
          }
          KEYCHAIN="$RUNNER_TEMP/multi-backup-ci.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$APPLE_SIGN_P12_B64" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
            -P "$APPLE_SIGN_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$MAC_SIGNING_ID"
          printf '%s' "$APPLE_NOTARY_KEY_B64" | base64 -D > "$RUNNER_TEMP/multi-backup-notary.p8"
          chmod 600 "$RUNNER_TEMP/multi-backup-notary.p8"
          echo "MULTI_BACKUP_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "MULTI_BACKUP_NOTARY_KEY=$RUNNER_TEMP/multi-backup-notary.p8" >> "$GITHUB_ENV"
      - name: Install helper tools
        shell: bash
        run: |
          brew install age gh git-lfs
          for helper in age age-keygen gh git-lfs git; do command -v "$helper" >/dev/null || exit 1; done
      - name: Build native Multi Backup.app (early ad-hoc / stable Developer ID)
        shell: bash
        env:
          MAC_SIGNING_ID: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          MAC_UNSIGNED_SMOKE: ${{ needs.qualify.outputs.channel == 'early-release' && '1' || '0' }}
          MAC_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-macos-app.sh
      - name: Notarize app, create drag-to-Applications DMG and notarize DMG
        if: needs.qualify.outputs.channel == 'stable'
        shell: bash
        env:
          MAC_SIGNING_ID: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          MAC_ARCH: ${{ matrix.arch }}
        run: bash scripts/notarize-macos.sh
      - name: Create and verify early-release TEST DMG
        if: needs.qualify.outputs.channel == 'early-release'
        shell: bash
        env:
          MAC_ARCH: ${{ matrix.arch }}
        run: bash scripts/package-macos-test-dmg.sh
      - name: Mount DMG and test relocated, notarized application
        if: needs.qualify.outputs.channel == 'stable'
        shell: bash
        env:
          MAC_ARCH: ${{ matrix.arch }}
        run: bash scripts/verify-macos-dmg.sh "multi-backup-macos-${MAC_ARCH}.dmg"
      - name: Remove temporary Apple credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${MULTI_BACKUP_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MULTI_BACKUP_KEYCHAIN" || true
          fi
          if [[ -n "${MULTI_BACKUP_NOTARY_KEY:-}" ]]; then
            rm -f "$MULTI_BACKUP_NOTARY_KEY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-${{ matrix.arch }}
          path: |
            *.dmg
            checksums-macos-*.txt
          if-no-files-found: error
          retention-days: 14
  windows:
    name: Windows 11 x64 installer
    needs: [qualify]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Python tools
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt 'pyinstaller>=6.11,<7'
          python scripts/create-photo-assets.py
      - name: Windows binary and executable dependencies
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --clean --noconfirm --name multi-backup --icon assets/multi-backup.ico --add-data "assets;assets" multi_backup.py
          python -m PyInstaller --onefile --windowed --clean --noconfirm --name MultiBackupGUI --icon assets/multi-backup.ico --add-data "assets;assets" gui_launcher.py
          New-Item -ItemType Directory -Force -Path dist/bin
          choco install age.portable -y --no-progress
          # The Chocolatey bin/age.exe is a SHIM referencing ../lib/...;
          # copying the shim to dist/bin produces a broken standalone executable.
          $chocoRoot = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
          $ageTools = Join-Path $chocoRoot 'lib\age.portable\tools'
          foreach ($exe in @('age.exe','age-keygen.exe')) {
            $real = Get-ChildItem -LiteralPath $ageTools -Filter $exe -File -Recurse | Select-Object -First 1
            if (!$real) { throw "Missing genuine $exe in age.portable installation" }
            Copy-Item -LiteralPath $real.FullName -Destination (Join-Path 'dist/bin' $exe)
          }
          foreach ($exe in @('gh.exe','git-lfs.exe')) {
            $tool = (Get-Command $exe -ErrorAction SilentlyContinue).Source
            if ($tool) { Copy-Item -LiteralPath $tool -Destination dist/bin/ }
          }
          & dist/bin/age.exe --version
          & dist/bin/age-keygen.exe --version
          Compress-Archive -Path dist/multi-backup.exe,dist/MultiBackupGUI.exe,dist/bin,LICENSE,README.md -DestinationPath multi-backup-windows11-x64.zip
      - name: Windows installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 not installed on the Windows runner' }
          & $iscc packaging/windows/installer.iss
          Get-FileHash installers/*.exe -Algorithm SHA256 | Out-File checksums-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          path: |
            multi-backup-windows11-x64.zip
            installers/*.exe
            checksums-windows.txt
          retention-days: 14
  linux-rpm:
    name: ${{ matrix.distro }} EL${{ matrix.el }} RPM
    needs: [qualify]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: rocky, el: 8, image: 'rockylinux/rockylinux:8'}
          - {distro: rocky, el: 9, image: 'rockylinux/rockylinux:9'}
          - {distro: rocky, el: 10, image: 'rockylinux/rockylinux:10'}
          - {distro: alma, el: 8, image: 'almalinux:8'}
          - {distro: alma, el: 9, image: 'almalinux:9'}
          - {distro: alma, el: 10, image: 'almalinux:10'}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build RPM on target runtime
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y rpm-build gcc binutils make findutils tar gzip git
          if [[ '${{ matrix.el }}' == 10 ]]; then
            dnf install -y python3 python3-pip python3-tkinter
            PYTHON=python3
          else
            dnf install -y python3.11 python3.11-pip python3.11-tkinter
            PYTHON=python3.11
          fi
          $PYTHON -m pip install -r requirements.txt 'pyinstaller>=6.11,<7'
          $PYTHON scripts/create-photo-assets.py
          $PYTHON -m PyInstaller --onefile --clean --noconfirm --name multi-backup \
            --add-data assets:assets multi_backup.py
          $PYTHON -m PyInstaller --onefile --windowed --clean --noconfirm --name multi-backup-gui \
            --add-data assets:assets gui_launcher.py
          mkdir -p "$HOME/rpmbuild/"{BUILD,RPMS,SOURCES,SPECS,SRPMS} packages
          cp dist/multi-backup dist/multi-backup-gui "$HOME/rpmbuild/SOURCES/"
          cp LICENSE packaging/linux/multi-backup.desktop "$HOME/rpmbuild/SOURCES/"
          cp assets/icon-256.png "$HOME/rpmbuild/SOURCES/multi-backup.png"
          rpmbuild -bb packaging/linux/multi-backup.spec --define "_topdir $HOME/rpmbuild"
          for rpm in $(find "$HOME/rpmbuild/RPMS" -type f -name '*.rpm' | sort); do
            cp "$rpm" "packages/multi-backup-${{ matrix.distro }}-el${{ matrix.el }}-$(basename "$rpm")"
          done
          test -n "$(find packages -name '*.rpm' -print -quit)"
          sha256sum packages/*.rpm > packages/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-${{ matrix.distro }}-el${{ matrix.el }}
          path: packages/*
          retention-days: 14
  publications:
    name: Generate manuals and brochure from current native GUI
    needs: [qualify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI screenshot and PDF build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth python3-tk fonts-dejavu-core poppler-utils
          python -m pip install -r requirements.txt -r requirements-docs.txt
          python scripts/create-photo-assets.py
      - name: Capture current GUI and generate bilingual publications
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1680x1200x24" python scripts/capture-ui.py
          python scripts/build-publications.py
          for item in docs/manuals/*.pdf docs/brochures/*.pdf; do
            test -s "$item"
            pdftotext "$item" - | grep -qi 'Multi Backup'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-publications
          path: |
            docs/manuals/*.pdf
            docs/brochures/*.pdf
            docs/screenshots/*.png
          retention-days: 30

  publish:
    name: Publish ${{ needs.qualify.outputs.channel }} releases
    needs: [qualify, macos, windows, linux-rpm, publications]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: collected
      - name: Prepare release assets and manifest
        shell: bash
        run: |
          mkdir release
          find collected -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.rpm' -o -name '*.zip' \) -exec cp '{}' release/ \;
          cp collected/native-publications/manuals/*.pdf collected/native-publications/brochures/*.pdf release/
          test $(find release -name '*.pdf' | wc -l) -eq 4
          test $(find release -name '*.dmg' | wc -l) -ge 2
          test $(find release -name '*.rpm' | wc -l) -ge 6
          test $(find release -name '*.exe' | wc -l) -ge 1
          sha256sum release/* > release/SHA256SUMS
          python scripts/make-release-manifest.py release "${{ needs.qualify.outputs.channel }}" "${{ github.sha }}"
      - name: Stable promotion requires production signing pipeline
        if: needs.qualify.outputs.channel == 'stable'
        shell: bash
        run: |
          echo 'Stable release is intentionally blocked for RC1 until notarization, Authenticode and signed RPM repositories are implemented and verified.' >&2
          exit 1
      - name: Publish immutable stable or rolling early release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.qualify.outputs.tag }}
          CHANNEL: ${{ needs.qualify.outputs.channel }}
        shell: bash
        run: |
          if [[ "$CHANNEL" == early-release ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --force early-release "$GITHUB_SHA"
            git push --force origin refs/tags/early-release
            gh release view "$TARGET" >/dev/null 2>&1 || gh release create "$TARGET" --target "$GITHUB_SHA" \
              --title 'Multi Backup - Early Release' --prerelease --notes 'Rolling builds from [full-ci] on main.'
          else
            gh release view "$TARGET" >/dev/null 2>&1 || gh release create "$TARGET" --title "Multi Backup $TARGET" \
              --latest --notes 'Stable release. Install only signed and verified packages.'
          fi
          if [[ "$CHANNEL" == early-release ]]; then
            # Remove legacy -test DMG assets as new clean names become available.
            # The release remains explicitly marked as a prerelease.
            for obsolete in multi-backup-macos-arm64-test.dmg multi-backup-macos-x86_64-test.dmg; do
              if gh release view "$TARGET" --json assets -q '.assets[].name' | grep -Fxq "$obsolete"; then
                gh release delete-asset "$TARGET" "$obsolete" --yes
              fi
            done
            gh release edit "$TARGET" --prerelease --title 'Multi Backup - Early Release' \
              --notes 'PRE-RELEASE: macOS DMGs use ad-hoc code signing and are NOT Apple Developer ID signed or notarized. Verify SHA-256, copy Multi Backup.app to Applications, and explicitly approve the first launch in macOS Privacy & Security if required. Never disable Gatekeeper globally. Stable distribution remains gated on signing and notarization.'
          fi
          gh release upload "$TARGET" release/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: release-catalog-${{ needs.qualify.outputs.channel }}
          path: release/*
          retention-days: 30

  rpm-repositories:
    if: needs.qualify.outputs.channel == 'early-release'
    name: Publish RPM indexes for ${{ needs.qualify.outputs.channel }}
    needs: [qualify, macos, windows, linux-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux-*
          path: downloaded
      - name: Build per-distro RPM repositories
        shell: bash
        env:
          CHANNEL: ${{ needs.qualify.outputs.channel }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y createrepo-c rpm
          mkdir -p website
          for distro in rocky alma; do
            for el in 8 9 10; do
              folder="website/$distro/el$el/x86_64"
              mkdir -p "$folder"
              find "downloaded/native-linux-$distro-el$el" -name '*.rpm' -exec cp '{}' "$folder/" \;
              test -n "$(find "$folder" -maxdepth 1 -name '*.rpm' -print -quit)"
              createrepo_c "$folder"
              cat > "website/multi-backup-$distro-el$el.repo" <<EOF
          [multi-backup-$CHANNEL]
          name=Multi Backup $CHANNEL - $distro EL$el
          baseurl=https://desalvo.github.io/multi-backup/$CHANNEL/$distro/el$el/x86_64
          enabled=0
          gpgcheck=1
          repo_gpgcheck=1
          metadata_expire=6h
          EOF
            done
          done
          echo '# Multi Backup RPM repositories' > website/index.md
          echo 'Repository definitions are disabled until RPM and repodata signing are configured.' >> website/index.md
      - name: Store static RPM indexes on gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./website
          destination_dir: ${{ needs.qualify.outputs.channel }}
          keep_files: true
          enable_jekyll: false
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-repositories-${{ needs.qualify.outputs.channel }}
          path: website
          retention-days: 30
