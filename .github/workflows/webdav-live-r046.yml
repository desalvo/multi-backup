name: Multi Backup - real authenticated WebDAV RO input and native encrypted HTTPS B-Out
on:
  workflow_call:
  push:
    branches: ["feature/**"]
    paths:
      - "rust/src/plugin_executor.rs"
      - "rust/src/mount_probe.rs"
      - "rust/src/chunk_store.rs"
      - "rust/src/archive.rs"
      - "rust/src/mounted_output.rs"
      - "rust/src/webdav_output.rs"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "scripts/test-real-webdav-r046.sh"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mb-r216-webdav-tls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-webdav:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install real WebDAV server/client and Rust age requirements
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y davfs2 rclone apache2-utils ca-certificates age jq openssl curl
          test -c /dev/fuse
          bash -n scripts/test-real-webdav-r046.sh
      - name: Build compiled Rust native plugin dispatcher
        run: cargo build --manifest-path rust/Cargo.toml --bin multi-backup-native
      - name: Genuine HTTPS WebDAV mounted RO input, native conditional PUT and independent GET restore
        env:
          RUNNER_ENVIRONMENT: github-hosted
        run: bash scripts/test-real-webdav-r046.sh
      - name: Record honest field boundary
        if: success()
        run: |
          echo "PASS genuine HTTPS Basic Auth WebDAV RO davfs2 input and DIRECT HTTPS create-only conditional PUT of age ciphertext, independent server GET, checksum-last and safe restore." >> "$GITHUB_STEP_SUMMARY"
          echo "NOT CERTIFIED server-side DAV ETag/ACL/xattr semantics, multipart/resumable large files, production snapshot locking or WebDAV FUSE writeback durability." >> "$GITHUB_STEP_SUMMARY"
