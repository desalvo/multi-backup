name: Multi Backup - real authenticated WebDAV RO input and encrypted RW output
on:
  push:
    branches: ["feature/**"]
    paths:
      - "rust/src/plugin_executor.rs"
      - "rust/src/mount_probe.rs"
      - "rust/src/chunk_store.rs"
      - "rust/src/archive.rs"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "scripts/test-real-webdav-r046.sh"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-webdav:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install real WebDAV server/client and Rust age requirements
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y davfs2 rclone apache2-utils ca-certificates age jq openssl curl
          test -c /dev/fuse
          bash -n scripts/test-real-webdav-r046.sh
      - name: Build compiled Rust native plugin dispatcher
        run: cargo build --manifest-path rust/Cargo.toml --bin multi-backup-native
      - name: Actual HTTPS WebDAV RO input and RW ciphertext B-Out with independent HTTPS GET
        env:
          RUNNER_ENVIRONMENT: github-hosted
        run: bash scripts/test-real-webdav-r046.sh
      - name: Record honest field boundary
        if: success()
        run: |
          echo "PASS real HTTPS Basic Auth WebDAV RO input and RW create-only age B-Out with independent remote HTTPS ciphertext GET, SHA-256 and isolated recovery." >> "$GITHUB_STEP_SUMMARY"
          echo "NOT CERTIFIED provider-specific ETag/ACL/xattr, remote service failure/fencing, large uploads or production snapshot semantics." >> "$GITHUB_STEP_SUMMARY"
