name: Multi Backup - disposable AFS runner script validation
on:
  pull_request:
    paths:
      - 'scripts/bootstrap-openafs-runner-vm.sh'
      - 'scripts/register-openafs-runner-once.sh'
      - 'scripts/patch-openafs-ansible-debian-facts.py'
      - 'scripts/test-real-afs-cell.sh'
      - 'docs/AFS_RUNNER_R039_IT.md'
      - '.github/workflows/afs-runner-lint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and policy without executing privileged scripts
        run: |
          set -euo pipefail
          bash -n scripts/bootstrap-openafs-runner-vm.sh
          bash -n scripts/register-openafs-runner-once.sh
          bash -n scripts/test-real-afs-cell.sh
          python3 -m py_compile scripts/patch-openafs-ansible-debian-facts.py
          grep -q 'afs-active' scripts/register-openafs-runner-once.sh
          grep -q 'viceetcdir' scripts/patch-openafs-ansible-debian-facts.py
          grep -q 'RUN_SUFFIX' scripts/test-real-afs-cell.sh
          grep -q -- 'DISPOSABLE-OPENAFS-VM' scripts/bootstrap-openafs-runner-vm.sh
          grep -q -- 'debian:12' scripts/bootstrap-openafs-runner-vm.sh
          grep -q -- '6.1.*-amd64' scripts/bootstrap-openafs-runner-vm.sh
          grep -q -- 'libicu72' scripts/bootstrap-openafs-runner-vm.sh
          grep -q -- 'ubuntu:22.04' scripts/bootstrap-openafs-runner-vm.sh
          grep -q -- '--ephemeral' scripts/register-openafs-runner-once.sh
          grep -q -- 'sha256sum --check' scripts/register-openafs-runner-once.sh
