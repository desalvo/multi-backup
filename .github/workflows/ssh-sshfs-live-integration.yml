name: Multi Backup - real SSH SCP SFTP and SSHFS acceptance
on:
  workflow_call:
  push:
    branches: ["feature/**"]
    paths:
      - 'rust/src/remote_restore.rs'
      - 'rust/src/ssh_input.rs'
      - 'rust/src/plugin_executor.rs'
      - 'rust/src/mount_probe.rs'
      - 'rust/src/chunk_store.rs'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'scripts/test-real-ssh-sshfs.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mb-r216-openssh-sshfs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ssh-scp-sftp:
    name: Real OpenSSH SSH, SCP and SFTP authentication and byte integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSH client/server and native protocol helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-client openssh-server age jq
      - name: Build native SSH encrypted streaming adapter
        run: cargo build --manifest-path rust/Cargo.toml --bin multi-backup-native
      - name: Test real SSH/SCP/SFTP and pinned SSH encrypted B-In
        run: bash scripts/test-real-ssh-sshfs.sh protocol
  sshfs-native-recovery:
    name: Real FUSE SSHFS read-only input, create-only RW ciphertext output and Rust recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSH server, SSHFS, FUSE and Rust age helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-client openssh-server sshfs fuse3 age jq
      - name: Build actual native Rust plugin
        run: cargo build --manifest-path rust/Cargo.toml --bin multi-backup-native
      - name: Test genuine SSHFS input/restore and encrypted B-Out with age readback
        run: bash scripts/test-real-ssh-sshfs.sh sshfs
