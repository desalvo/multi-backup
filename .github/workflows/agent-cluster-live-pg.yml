name: Multi Backup - live PostgreSQL agent and HA acceptance
on:
  push:
    branches: ["feature/**"]
    paths:
      - "rust-server/src/cluster.rs"
      - "rust-server/src/live_pg_acceptance.rs"
      - "rust-server/src/agent_registry.rs"
      - "rust-server/src/internal_db_backup.rs"
      - "rust-server/src/monitoring.rs"
      - ".github/workflows/agent-cluster-live-pg.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  agent-ha-real-postgres:
    name: Real PG16 agent trust and two-replica lease fencing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mb_live
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: mb_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mb_live -d mb_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native age encryption/restore binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          age --version
      - name: Exercise real database enrollment, nonces, replica leases and quarantine
        env:
          MULTI_BACKUP_TEST_PG_DSN: postgresql://mb_live:local_ci_only@127.0.0.1:5432/mb_ci?sslmode=disable
        run: |
          set -euo pipefail
          cargo test --manifest-path rust-server/Cargo.toml real_pg_ -- --ignored --test-threads=1 --nocapture
