name: Multi Backup - real Oracle Free RMAN encrypted PDB backup-piece acceptance
on:
  workflow_call:
  push:
    branches: ["feature/**"]
    paths:
      - 'rust/src/database.rs'
      - 'rust/src/oracle_rman.rs'
      - 'rust/src/archive.rs'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'scripts/test-oracle-free-container.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mb-oracle-free-physical-pitr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  oracle-free-live-rman:
    name: Real Oracle Free PDB/CDB physical RMAN restore and SCN PITR from Rust encrypted backup pieces
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - name: Install actual age, jq, OpenSSL and validate acceptance script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age jq openssl
          bash -n scripts/test-oracle-free-container.sh
      - name: Compile exact PR Rust native executable
        run: cargo build --manifest-path rust/Cargo.toml --release --bin multi-backup-native
      - name: Oracle Database Free authentic RMAN PDB backup and encrypted roundtrip
        run: bash scripts/test-oracle-free-container.sh
      - name: Record precise qualification scope
        if: success()
        run: |
          echo 'PASS when script succeeds: Oracle Free physical PDB RESTORE/RECOVER, whole-CDB RESTORE/RECOVER and SCN PITR with before/after marker assertions, using Rust age-restored RMAN media.' >> "$GITHUB_STEP_SUMMARY"
          echo 'PASS dedicated native Oracle RMAN media import and create-only restore with real PDB RMAN RESTORE VALIDATE.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NOT CERTIFIED: production Oracle RAC/ASM, TDE, standby, restore-to-different-host, automated orchestration, Oracle licensing beyond Free.' >> "$GITHUB_STEP_SUMMARY"
