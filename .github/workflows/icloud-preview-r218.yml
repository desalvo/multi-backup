name: Multi Backup r218 - optional iCloud Drive B-In B-Out encrypted preview
on:
  push:
    branches: ["feature/r218-mobile-clients"]
    paths:
      - "rust/src/icloud_drive.rs"
      - "rust/src/plugins.rs"
      - "rust/src/bin/multi-backup-native.rs"
      - "rust/src/lib.rs"
      - "scripts/ci/test-icloud-r218.sh"
      - ".github/workflows/icloud-preview-r218.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mb-icloud-r218-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-verified:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install age and validate script syntax
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y age
          bash -n scripts/ci/test-icloud-r218.sh
      - name: Compile native Rust iCloud module and tests
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml icloud -- --nocapture
          cargo build --manifest-path rust/Cargo.toml --bin multi-backup-native
      - name: Real age encryption with synthetic rclone file transport
        run: bash scripts/ci/test-icloud-r218.sh
      - name: Record incomplete Apple certification
        if: success()
        run: |
          echo 'PASS offline Rust and age iCloud commands; Apple 2FA and real iCloud Drive field test NOT performed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'iCloud remains PREVIEW. This workflow cannot block r217 RC.' >> "$GITHUB_STEP_SUMMARY"
