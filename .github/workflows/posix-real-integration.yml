name: Multi Backup - real POSIX native filesystem acceptance
on:
  push:
    branches: ["feature/**"]
    paths:
      - 'rust/src/chunk_store.rs'
      - 'rust/src/plugin_executor.rs'
      - 'rust/src/backup_chain.rs'
      - 'rust/src/backup_policy.rs'
      - 'rust/src/archive.rs'
      - 'rust/src/bin/multi-backup-native.rs'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'scripts/test-posix-real-roundtrip.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-posix-full-incremental:
    name: POSIX full/incremental encrypted E2E and fault injection
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install real age, jq and coreutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age jq
      - name: Compile real Rust plugin
        run: cargo build --manifest-path rust/Cargo.toml --bin multi-backup-native
      - name: Real POSIX filesystem encrypted full/incremental restore
        run: bash scripts/test-posix-real-roundtrip.sh
