name: Rust focused validation

on:
  workflow_call:
    inputs:
      full_suite:
        description: "Run the existing Rust tests for all three targets exactly once"
        required: false
        type: boolean
        default: false
  push:
    branches: ["feature/**"]
    paths:
      - "rust/**"
      - "rust-desktop/**"
      - "rust-server/**"

permissions:
  contents: read
  pull-requests: read
concurrency:
  group: mb-rust-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Determine which Rust components changed
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.force.outputs.core || steps.filter.outputs.core }}
      server: ${{ steps.force.outputs.server || steps.filter.outputs.server }}
      desktop: ${{ steps.force.outputs.desktop || steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse every existing component test in a single-SHA readiness gate
        id: force
        if: inputs.full_suite == true
        run: |
          echo 'core=true' >> "$GITHUB_OUTPUT"
          echo 'server=true' >> "$GITHUB_OUTPUT"
          echo 'desktop=true' >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        if: inputs.full_suite != true
        id: filter
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            core:
              - 'rust/**'
            server:
              - 'rust-server/**'
              - 'rust/src/lib.rs'
              - 'rust/src/s3_vault.rs'
              - 'rust/Cargo.toml'
            desktop:
              - 'rust-desktop/**'
              - 'rust/src/lib.rs'
              - 'rust/src/s3_vault.rs'
              - 'rust/Cargo.toml'

  rust-core:
    needs: [changes]
    if: needs.changes.outputs.core == 'true'
    name: Encrypted chunk/core integration and fault injection
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install age for authenticated roundtrip tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
      - name: Verify chunk store, migration and portable archives
        run: cargo test --manifest-path rust/Cargo.toml --all-targets

  rust-server:
    needs: [changes]
    if: needs.changes.outputs.server == 'true'
    name: OIDC, LDAP, SMTP, WebDAV compile and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile/test server identity, mount and notifications
        run: cargo test --manifest-path rust-server/Cargo.toml --all-targets

  rust-desktop:
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    name: Rust desktop compile without external packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libasound2-dev
      - name: Compile and execute native desktop unit tests
        run: cargo test --manifest-path rust-desktop/Cargo.toml --all-targets
