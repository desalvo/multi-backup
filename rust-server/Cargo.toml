[package]
name = "multi-backup-server"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
publish = false

[dependencies]
multi-backup-core = { path = "../rust" }
axum = { version = "0.7", features = ["form", "json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["clock"] }
rpassword = "7.3"
zeroize = "1.8"

lettre = { version = "=0.11.23", default-features = false, features = ["builder","smtp-transport","rustls-tls"] }

ldap3 = { version = "=0.11.5", default-features = false, features = ["sync","tls-rustls"] }

openidconnect = { version = "=4.0.1", default-features = true }

base64 = "0.22"
bytes = "1"
futures-util = "0.3"
percent-encoding = "2"
subtle = "2"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2.5"

# Standalone TLS listener for the monitor.read-only REST API (not the web UI)
axum-server = { version = "=0.7.3", features = ["tls-rustls"] }
# Select an explicit rustls process CryptoProvider, even when other crates
# transitively enable ring and aws-lc-rs simultaneously.
rustls = { version = "0.23", features = ["aws_lc_rs"] }
