[package]
name = "multi-backup-server"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
publish = false

[dependencies]
multi-backup-core = { path = "../rust" }
axum = { version = "0.7", features = ["form", "json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["clock"] }
rpassword = "7.3"
zeroize = "1.8"

lettre = { version = "=0.11.23", default-features = false, features = ["builder","smtp-transport","rustls-tls"] }
